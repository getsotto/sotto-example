name: Check examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Examples (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: '3.13'
      - name: Test the example checker
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '24'
      - uses: actions/setup-go@fba3fb4ead8c8e09a06f1d32ae5436e5818eff15
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@bbbb8c9ab609f9ab643834ffe948a0f577bc4c0c
        with:
          dotnet-version: '10.0.x'
      - uses: shivammathur/setup-php@c482204203a2eb89366ad513842766b70efaaee8
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Check all nine languages
        run: python scripts/check_examples.py

  local-sotto:
    name: Local Sotto walkthrough (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: '3.13'
      - name: Install local keyring and pinned Sotto release
        env:
          SOTTO_VERSION: v0.9.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-keyring dbus-x11
          curl -fsSL https://raw.githubusercontent.com/getsotto/sotto/fbd4f2542daf5580da361aabe93e8804758df6b5/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the documented flow in a disposable keyring
        run: |
          dbus-run-session -- bash -euc '
            printf "%s" "disposable-ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            python scripts/check_sotto.py
          '
